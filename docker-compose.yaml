version: '3.9'

services:
  postgres:
    image: postgres:17.5
    container_name: project_db
    ports:
      - 15432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/00-init-schema.sql:/docker-entrypoint-initdb.d/00-init-schema.sql
      - ./docker/postgres/seed/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql
      - ./docker/postgres/seed/02-users.sql:/docker-entrypoint-initdb.d/02-users.sql
      - ./docker/postgres/seed/03-projects.sql:/docker-entrypoint-initdb.d/03-projects.sql
      - ./docker/postgres/seed/04-project_members.sql:/docker-entrypoint-initdb.d/04-project_members.sql
      - ./docker/postgres/seed/05-tasks.sql:/docker-entrypoint-initdb.d/05-tasks.sql

volumes:
  pgdata: